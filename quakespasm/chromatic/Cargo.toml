[workspace]
members = ["chroma"]

[workspace.package]
edition = "2021"
authors = ["Shawn Walker-Salas <binarycrusader@gmail.com>"]

[package]
name = "chromatic"
version = "0.1.0"
edition.workspace = true
authors.workspace = true

[dependencies]
chroma = { path = "chroma" }
anyhow = "1.0.100"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", default-features = false, features = ["Wdk_System_SystemServices", "Win32_Media", "Win32_System_Console", "Win32_System_Diagnostics_Debug", "Win32_System_SystemInformation"] }
