[package]
name = "chroma"
version = "0.1.0"
edition.workspace = true
authors.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
bitflags = "2.10"
gl = "0.14"
libc = "0.2"
num = "0.4"
lazy_static = "1.5.0"
send_wrapper = "0.6.0"
sdl2 = "0.38.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", default-features = false, features = ["Wdk_System_SystemServices", "Win32_Media", "Win32_System_Console", "Win32_System_Diagnostics_Debug", "Win32_System_SystemInformation"] }
